org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 按需配置 + 文件系统监听：只重配变更模块、跨构建复用文件树扫描，纯构建期加速，不改产物
org.gradle.configureondemand=true
org.gradle.vfs.watch=true
# Kotlin 增量编译，改动少量文件时只重编相关单元
kotlin.incremental=true
# R8 全模式：更激进的死代码消除与优化（AGP8 已默认开，显式声明防回归）
android.enableR8.fullMode=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 设备专属覆盖（aapt2 路径 / JDK 路径）不放版本库：写在本机 ~/.gradle/gradle.properties。
# CI（ubuntu-latest）读到的就是这份干净配置；本机 Tools/build.sh 会自检并自动补齐。
