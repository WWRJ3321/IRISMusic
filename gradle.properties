org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 按需配置 + 文件系统监听：只重配变更模块、跨构建复用文件树扫描，纯构建期加速，不改产物
org.gradle.configureondemand=true
org.gradle.vfs.watch=true
# Kotlin 增量编译，改动少量文件时只重编相关单元
kotlin.incremental=true
# R8 全模式：更激进的死代码消除与优化（AGP8 已默认开，显式声明防回归）
android.enableR8.fullMode=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# aarch64 设备：AGP 下载的 aapt2 是 x86_64，用系统 ARM 原生版绕过
android.aapt2FromMavenOverride=/opt/aapt2-fix/aapt2
# 用完整 JDK（含 jlink），否则开启 buildConfig 后 Release 构建的 jdkImage 转换会失败
org.gradle.java.home=/opt/jdk-17.0.20.1+1
