name: Build Release APK

on:
  push:
    branches: [ main ]  # 修改：只要往 main 分支提交代码就自动触发构建
  workflow_dispatch:    # 保留：支持在 Actions 页面手动点击运行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5   # 从 v4 升级到 v5，消除 Node.js 20 弃用警告
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''   # 关键修复：阻止安装已被移除的 'tools' 包

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show effective gradle.properties
        run: cat gradle.properties

      # 权限审计：除了下列已声明权限外不允许出现新的权限。
      - name: Audit manifest permissions
        run: |
          echo "--- declared permissions ---"
          grep -o 'android.permission.[A-Z_]*' app/src/main/AndroidManifest.xml | sort -u | tee /tmp/perms.txt
          cat > /tmp/allowed.txt <<'EOF'
          android.permission.FOREGROUND_SERVICE
          android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK
          android.permission.INTERNET
          android.permission.POST_NOTIFICATIONS
          android.permission.MANAGE_EXTERNAL_STORAGE
          android.permission.READ_EXTERNAL_STORAGE
          android.permission.READ_MEDIA_AUDIO
          android.permission.SYSTEM_ALERT_WINDOW
          android.permission.VIBRATE
          android.permission.WAKE_LOCK
          EOF
          sort -u /tmp/allowed.txt -o /tmp/allowed.txt
          if ! diff -u /tmp/allowed.txt /tmp/perms.txt; then
            echo "::error::Manifest permissions changed. Review privacy claims before releasing."
            exit 1
          fi
          echo "Permission audit passed."

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Compute checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk | tee SHA256SUMS.txt
          echo "--- build provenance ---"
          echo "commit: ${GITHUB_SHA}"
          echo "ref:    ${GITHUB_REF}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt

      # 这个步骤只有在打 tag 发版时才会触发，平时自动构建不影响
      - name: Attach checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/SHA256SUMS.txt
